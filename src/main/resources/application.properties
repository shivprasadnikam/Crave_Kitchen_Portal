# =====================================================
# DATABASE CONFIGURATION
# =====================================================

# Oracle Database Configuration
# oracle db config
spring.datasource.url=jdbc:oracle:thin:@//localhost:1521
spring.datasource.username=my_user
spring.datasource.password=my_password
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.jpa.hibernate.ddl-auto=update

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# Oracle-specific pagination configuration
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

# Oracle-specific SQL generation
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.OracleDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.jdbc.use_get_generated_keys=true

# Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# =====================================================
# LOGGING CONFIGURATION
# =====================================================

# Root logging level
logging.level.root=INFO

# Application-specific logging
logging.level.com.example.crave.kitchen.portal=DEBUG
logging.level.com.example.crave.kitchen.portal.service=DEBUG
logging.level.com.example.crave.kitchen.portal.impl=DEBUG
logging.level.com.example.crave.kitchen.portal.controller=DEBUG
logging.level.com.example.crave.kitchen.portal.repository=DEBUG

# Menu-specific logging
logging.level.com.example.crave.kitchen.portal.service.MenuService=DEBUG
logging.level.com.example.crave.kitchen.portal.impl.MenuServiceImpl=DEBUG
logging.level.com.example.crave.kitchen.portal.controller.MenuController=DEBUG
logging.level.com.example.crave.kitchen.portal.repository.MenuCategoryRepository=DEBUG
logging.level.com.example.crave.kitchen.portal.repository.MenuItemRepository=DEBUG
logging.level.com.example.crave.kitchen.portal.repository.MenuItemImageRepository=DEBUG
logging.level.com.example.crave.kitchen.portal.repository.MenuItemAvailabilityRepository=DEBUG

# Spring Security logging
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.web=DEBUG

# Token extraction logging
logging.level.com.example.crave.kitchen.portal.util.TokenDataExtractor=DEBUG
logging.level.com.example.crave.kitchen.portal.service.JwtTokenService=DEBUG

# JPA/Hibernate SQL logging
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.hibernate.type.descriptor.sql=TRACE

# Spring Web logging
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping=TRACE

# Database connection logging
logging.level.com.zaxxer.hikari=DEBUG
logging.level.org.springframework.jdbc=DEBUG

# =====================================================
# LOGGING PATTERN CONFIGURATION
# =====================================================

# Console logging pattern
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# File logging pattern
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# =====================================================
# LOG FILE CONFIGURATION
# =====================================================

# Enable file logging
logging.file.name=logs/crave-kitchen-portal.log
logging.file.max-size=10MB
logging.file.max-history=30

# Log file pattern
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.total-size-cap=1GB

# =====================================================
# MENU-SPECIFIC LOGGING
# =====================================================

# Menu operation logging
logging.level.com.example.crave.kitchen.portal.menu=DEBUG

# Performance logging
logging.level.com.example.crave.kitchen.portal.performance=DEBUG

# =====================================================
# SECURITY CONFIGURATION
# =====================================================

# JWT Configuration
jwt.secret=your-secret-key-here-make-it-long-and-secure-for-production
jwt.access-token.expiration=3600
jwt.refresh-token.expiration=86400

# =====================================================
# SERVER CONFIGURATION
# =====================================================

# Server port
server.port=9090

# Server context path
server.servlet.context-path=/

# =====================================================
# VALIDATION CONFIGURATION
# =====================================================

# Enable validation
spring.validation.enabled=true

# =====================================================
# ACTUATOR CONFIGURATION (for monitoring)
# =====================================================

# Enable actuator endpoints
management.endpoints.web.exposure.include=health,info,metrics,loggers
management.endpoint.health.show-details=always

# =====================================================
# CORS CONFIGURATION
# =====================================================

# CORS settings
spring.web.cors.allowed-origins=*
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*

# =====================================================
# FILE UPLOAD CONFIGURATION
# =====================================================

# File upload settings
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.enabled=true

# =====================================================
# CACHE CONFIGURATION
# =====================================================

# Enable caching
spring.cache.type=caffeine
spring.cache.cache-names=menu-categories,menu-items,menu-images
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=30m

# =====================================================
# PROFILES
# =====================================================

# Active profile
spring.profiles.active=dev

# =====================================================
# DEVELOPMENT TOOLS
# =====================================================

# Enable dev tools
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

# =====================================================
# CUSTOM MENU LOGGING PROPERTIES
# =====================================================

# Menu operation tracking
menu.logging.enabled=true
menu.logging.performance.enabled=true
menu.logging.sql.enabled=true
menu.logging.security.enabled=true

# Menu audit logging
menu.audit.enabled=true
menu.audit.log-changes=true
menu.audit.log-access=true

# Menu performance thresholds
menu.performance.slow-query-threshold=1000
menu.performance.warning-threshold=500
